.svc-media{position:relative;aspect-ratio:1/1.08;max-width:100%;background:var(--bg-2);display:grid;place-items:center;overflow:hidden;isolation:isolate}
.svc-media::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 60% at 50% 40%,rgba(255,255,255,.65),transparent 70%)}
.svc-media .ic{width:38%;height:auto;aspect-ratio:1;stroke-width:.7;color:var(--petrol);transition:transform 1s var(--ease)}
.svc:hover .svc-media .ic{transform:scale(1.08)}
.svc-media .tag{position:absolute;top:12px;inset-inline-start:12px;padding:3px 9px;background:var(--surface);font-size:.72rem;color:var(--ink)}
.svc-media .tag.hot{background:var(--petrol);color:var(--cream)}
.svc-media .no{position:absolute;top:10px;inset-inline-end:14px;font-family:var(--f-latin);font-size:1rem;color:var(--ink-3);letter-spacing:.1em}
.svc-media .add{position:absolute;inset-inline:0;bottom:0;padding:14px;background:var(--ink);color:var(--cream);font-size:.88rem;text-align:center;transform:translateY(101%);transition:transform .45s var(--ease)}
.svc:hover .svc-media .add,.svc:focus-visible .svc-media .add{transform:none}
.svc .cat{font-size:.76rem;color:var(--ink-3)}
.svc h3{font-family:var(--f-display);font-weight:400;font-size:1.22rem;line-height:1.35}
.svc .price-line{font-size:.85rem;color:var(--ink-2)}
.svc .svc-desc{font-size:.86rem;color:var(--ink-3);line-height:1.7}
.svc.featured{grid-column:auto;background:transparent;color:inherit}
.svc[hidden]{display:none!important}

/* the edit band */
.band{background:var(--petrol);color:var(--cream);padding-block:0}
.band-grid{display:grid;grid-template-columns:1fr 1fr;min-height:520px}
.band-visual{position:relative;overflow:hidden;background:radial-gradient(90% 70% at 40% 40%,#8A1A1F,var(--petrol-night));display:grid;place-items:center;isolation:isolate}
.band-visual::before{content:"";position:absolute;inset:-20%;z-index:-1;opacity:.45;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(255,236,190,.6) 70px 120px,transparent 120px 210px);animation:light 18s ease-in-out infinite alternate}
.band-card{width:min(300px,70%);aspect-ratio:1.58;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#E9CF8F,#B88A3E 55%,#8C6424);color:#2A1206;box-shadow:0 40px 70px -30px rgba(0,0,0,.7);transform:rotate(-6deg);transition:transform .8s var(--ease)}
.band-visual:hover .band-card{transform:rotate(0) scale(1.03)}
.band-card b{font-family:var(--f-display);font-weight:500;font-size:1.4rem}
.band-copy{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:64px clamp(20px,6vw,88px)}
.band-copy h2{font-size:var(--fs-3xl);line-height:1.2}
.band-copy p{color:rgba(247,242,233,.75);max-width:30em}
.band-copy .buy{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:22px;border-top:1px solid rgba(247,242,233,.18)}
.band-copy .buy b{font-family:var(--f-display);font-size:2.2rem;font-weight:400}
.band-copy small{color:rgba(247,242,233,.55)}

/* story + stats */
.story{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.story h2{font-size:var(--fs-3xl);line-height:1.25}
.story p{color:var(--ink-2);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:56px;border-top:1px solid var(--line)}
.stat{padding:26px 4px 0;display:grid;gap:4px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,4vw,3rem);line-height:1;color:var(--petrol)}
.stat small{color:var(--ink-3);font-size:.85rem}

/* numbered promises */
.promises{border-top:1px solid var(--line)}
.promise{display:grid;grid-template-columns:90px 1fr 1.2fr;gap:20px;align-items:baseline;padding:30px 0;border-bottom:1px solid var(--line);transition:padding .4s var(--ease)}
.promise:hover{padding-inline-start:12px}
.promise span{font-family:var(--f-latin);font-size:1.1rem;color:var(--gold);letter-spacing:.1em}
.promise b{font-family:var(--f-display);font-weight:400;font-size:1.45rem}
.promise p{color:var(--ink-2);font-size:.95rem}

/* steps, alerts, plans, points, gifts, features — quieter */
.steps::before{background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 8px);height:1px;top:34px}
.step-no{border-radius:50%;background:var(--bg);border:1px solid var(--line-2);box-shadow:none;font-family:var(--f-latin);font-weight:500;color:var(--ink)}
.step:hover .step-no{transform:none;background:var(--petrol);color:var(--cream)}
.atype{border-radius:0}
.atype.on{background:var(--cream);color:var(--ink)}
.atype.on .ic{color:var(--petrol)}
.phone-mock{border-radius:44px}
.cycle{border-radius:0;padding:4px;box-shadow:none;border-color:var(--line-2);background:transparent}
.cycle button,.cycle .knob{border-radius:0}
.save-tag{border-radius:0;background:var(--saffron-soft);color:var(--ink)}
.plans{gap:0;border:1px solid var(--line)}
.plan{border-radius:0;border:0;border-inline-end:1px solid var(--line);box-shadow:none;background:var(--surface);padding:30px 24px}
.plan:last-child{border-inline-end:0}
.plan:hover{transform:none;box-shadow:none;background:var(--surface-2)}
.plan.popular{transform:none;background:var(--petrol)}
.plan.popular:hover{transform:none;background:var(--petrol-deep)}
.plan.popular::before{display:none}
.plan .ribbon{border-radius:0;top:0;inset-inline-start:auto;inset-inline-end:0;translate:none;background:var(--saffron-soft);color:var(--ink);box-shadow:none;font-weight:400}
[dir="ltr"] .plan .ribbon{translate:none}
.plan-gem{border-radius:0;box-shadow:none;width:10px;height:10px}
.plan h3{font-weight:400;font-size:1.4rem}
.price b{font-weight:400}
.plan.popular .btn-primary{--b-bg:var(--saffron-soft);--b-fg:var(--ink)}
.plan-vip{background:var(--surface)}
.earn{border-radius:0;background:var(--petrol);color:var(--cream)}
.earn .btn-brand{--b-bg:var(--cream);--b-fg:var(--ink)}
.tier{border-radius:0;background:var(--surface)}
.tier-gem{border-radius:0}
.reward{border-radius:0;background:var(--surface)}
.reward:hover{transform:none;box-shadow:var(--shadow-md)}
.reward-ic{border-radius:0;background:var(--bg-2);color:var(--petrol)}
.gift-card{border-radius:0}
.gift-step::before{border-radius:50%;font-family:var(--f-latin);font-weight:500;color:var(--ink);background:transparent}
.feat{border-radius:0;background:transparent;border:0;border-top:1px solid var(--line);padding:22px 0 0}
.feat:hover{transform:none;box-shadow:none}
.feat .ic{color:var(--petrol);stroke-width:1.2}
.faq details{border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--line)}
.faq details[open]{box-shadow:none}
.faq summary{padding:22px 0;font-weight:400;font-family:var(--f-display);font-size:1.15rem}
.faq details p{padding:0 0 22px}
.contact{border-radius:0;background:transparent;border-color:rgba(247,242,233,.18)}
.contact:hover{transform:none;background:rgba(247,242,233,.05)}
.cta-band{border-radius:0;background:var(--cream);color:var(--ink)}
.insta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.insta b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-2xl)}

/* app surfaces */
.card,.kpi,.rail,.order,.alert-row,.cart-item,.car-item,.welcome,.member-card,.upsell,.price-note,.table-wrap,.tabs,.empty{border-radius:0}
.card,.kpi,.order,.alert-row,.cart-item{box-shadow:none}
.order:hover,.alert-row:hover{transform:none;box-shadow:none;border-color:var(--line-2)}
.order-ic{border-radius:0}
.rail{padding:8px}
.rail a{border-radius:0}
.rail a.active{background:var(--ink);color:var(--cream)}
.tabs{padding:0;border:0;background:transparent;gap:4px 22px}
.tabs button{border-radius:0;padding:6px 0;color:var(--ink-3);border-bottom:1px solid transparent}
.tabs button:hover{background:transparent}
.tabs button.on{background:transparent;color:var(--ink);border-color:var(--ink)}
.tabs .badge,.tabs button.on .badge{background:var(--bg-2);color:var(--ink)}
.input,.select,.textarea{border-radius:0;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding-inline:2px;font-weight:300}
.input:focus,.select:focus,.textarea:focus{box-shadow:none;border-color:var(--ink)}
.textarea{border:1px solid var(--line-2);padding:.8em}
.phone-field{border-radius:0;border-width:0 0 1px;background:transparent}
.phone-field:focus-within{box-shadow:none;border-color:var(--ink)}
.phone-field .cc{background:transparent;border:0}
.phone-field input{font-family:var(--f-body);font-weight:300;letter-spacing:.18em}
.opt span{border-radius:0;font-weight:400;background:transparent}
.opt input:checked + span{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.opt input:checked + span::before{background:var(--cream);border-color:var(--cream);box-shadow:inset 0 0 0 3px var(--ink)}
.opt span::before{border-radius:0}
.day span{border-radius:0;background:transparent}
.day input:checked + span{background:var(--ink);border-color:var(--ink)}
.form-sec h4 i{border-radius:0;background:transparent;color:var(--gold);font-family:var(--f-latin);font-size:1rem;width:auto}
.modal{border-radius:0}
.modal-head .svc-ic,.svc-ic{border-radius:0;box-shadow:none}
.modal-foot{background:var(--bg)}
.toast{border-radius:0;background:var(--ink);color:var(--cream)}
.chat,.msg,.quick button,.chat-head .bot{border-radius:0}
.msg.bot{border-start-start-radius:0}
.msg.me{border-start-end-radius:0}
.chat-input .input{border-radius:0;border:1px solid var(--line-2);padding-inline:12px}
.chat-head{background:var(--petrol)}
.chat-fab{background:var(--petrol);color:var(--cream);box-shadow:0 14px 30px -10px rgba(94,0,6,.5)}
.chat-fab::before{border-color:var(--petrol)}
.chat-fab .dot{border-color:var(--bg)}
.welcome{background:var(--petrol)}
.kpi b,.page-head h1,.card-head h3{font-weight:400}
.track-step i{border-width:1px}
.track-step.now i{background:var(--petrol);border-color:var(--petrol);color:var(--cream);box-shadow:0 0 0 6px rgba(94,0,6,.1)}
.track::after{background:var(--petrol)!important}
.countdown.soon{--c:var(--gold)}
.bar i{background:var(--petrol)}
.dash-points .bar i,.member-card .bar i{background:var(--saffron)}
.auth-art{background:radial-gradient(120% 80% at 70% 20%,#8A1A1F 0%,var(--petrol) 42%,var(--petrol-night) 100%)}
.auth-art::before{opacity:.5;mix-blend-mode:soft-light;background-image:repeating-linear-gradient(115deg,transparent 0 70px,rgba(255,236,190,.55) 70px 120px,transparent 120px 210px)}
.admin-badge{border-radius:0;background:var(--petrol);color:var(--cream);font-weight:400}
.bars i{border-radius:0;background:var(--petrol)}
.footer{background:var(--petrol-night)}
.tabbar{background:var(--glass);border-top:1px solid var(--line)}
.tabbar a{border-radius:0}
.tabbar a.active .ic{color:var(--petrol)}
.tabbar a.active::before{background:var(--petrol);border-radius:0;height:2px}
.svc-top,.svc-foot,.svc ul{display:none}

@media (max-width:1080px){
  .plans{grid-template-columns:repeat(2,1fr)}
  .plan:nth-child(2){border-inline-end:0}
  .plan:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:920px){
  .hero2,.band-grid,.story{grid-template-columns:1fr}
  .hero2{min-height:0}
  .visual{min-height:420px}
  .band-visual{min-height:340px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .promise{grid-template-columns:60px 1fr}
  .promise p{grid-column:2}
}
@media (max-width:640px){
  :root{--top-h:64px}
  .brand svg{height:32px;width:95px}
  .tiles{grid-template-columns:1fr}
  .svc-grid{grid-template-columns:repeat(2,1fr);gap:26px 14px}
  .svc .svc-desc{display:none}
  .svc h3{font-size:1.05rem}
  .hero2-copy{padding:40px 20px 48px}
  .visual{min-height:380px}
  .visual .emblem{top:16%}
  .float-note{display:none}
  .float-card{inset-inline:16px;bottom:22px;min-width:0}
  .plan{border-inline-end:0;border-bottom:1px solid var(--line)}
  .plan:last-child{border-bottom:0}
  .top-actions .hide-sm{display:none}
}

/* loading screen (Tibr-style split curtain) */
.intro{position:fixed;inset:0;z-index:300}
.intro-half{position:absolute;inset-inline:0;height:50.2%;background:var(--petrol);transition:transform 1s cubic-bezier(.76,0,.24,1)}
.intro-half.t{top:0}
.intro-half.b{bottom:0;background:var(--petrol)}
.intro.open .intro-half.t{transform:translateY(-101%)}
.intro.open .intro-half.b{transform:translateY(101%)}
.intro.open{pointer-events:none}
.intro-mark{position:absolute;inset:0;display:grid;place-items:center}
.intro-mark svg{width:clamp(160px,22vw,250px);height:auto;aspect-ratio:862/290;color:var(--saffron-soft);opacity:0;transform:translateY(14px);animation:introMark 1s .15s var(--ease) forwards}
@keyframes introMark{to{opacity:1;transform:none}}
.intro.open .intro-mark{opacity:0;transition:opacity .45s var(--ease)}
.intro-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0;text-align:center;font-size:11px;letter-spacing:.24em;color:rgba(242,231,216,.45)}
/* if the script never runs, the curtain still opens on its own */
.intro:not(.open) .intro-half.t{animation:introT 1s 3s cubic-bezier(.76,0,.24,1) forwards}
.intro:not(.open) .intro-half.b{animation:introB 1s 3s cubic-bezier(.76,0,.24,1) forwards}
.intro:not(.open){animation:introGone 0s 4s forwards}
@keyframes introT{to{transform:translateY(-101%)}}
@keyframes introB{to{transform:translateY(101%)}}
@keyframes introGone{to{visibility:hidden;pointer-events:none}}
/* the hero waits behind the curtain, then wipes in */
.visual{animation:heroWipe 1.3s .15s cubic-bezier(.76,0,.24,1) both}
@keyframes heroWipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
[dir="ltr"] .visual{animation-name:heroWipeL}
@keyframes heroWipeL{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
html.intro-on .hero2,html.intro-on .hero2 *,html.intro-on .hero2 *::before{animation-play-state:paused!important}
html.intro-on body{overflow:hidden}
@media (prefers-reduced-motion:reduce){.intro{display:none}}

/* loyalty, editorial */
.loyal{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,6vw,80px);align-items:center;margin-bottom:72px}
.loyal > *{min-width:0}
.loyal-intro .sec-head{margin-bottom:26px}
.rate{display:flex;align-items:center;gap:20px;padding-block:22px;border-block:1px solid var(--line);margin-bottom:28px}
.rate b{font-family:var(--f-body);font-weight:200;font-size:clamp(4.2rem,8vw,6.4rem);line-height:.85;color:var(--petrol);letter-spacing:-.02em}
.rate span{font-family:var(--f-display);font-size:1.5rem;line-height:1.3;color:var(--ink)}
.rate small{display:block;margin-top:4px;font-family:var(--f-body);font-size:.85rem;line-height:1.6;color:var(--ink-3);max-width:20em}
.tier-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding-top:34px}
.tier-track::before,.tier-track::after{content:"";position:absolute;top:56px;inset-inline-start:12.5%;width:75%;height:1px;background:var(--line-2)}
.tier-track::after{height:2px;margin-top:-.5px;background:var(--gold);transform:scaleX(var(--fill,1));transform-origin:right}
[dir="ltr"] .tier-track::after{transform-origin:left}
.tier-track.in::after{animation:trackIn 1.8s .2s var(--ease) both}
@keyframes trackIn{from{transform:scaleX(0)}}
.tt{position:relative;display:grid;justify-items:center;align-content:start;text-align:center;gap:4px;padding-inline:6px}
.tt-dot{position:relative;z-index:1;width:46px;height:46px;display:grid;place-items:center;background:var(--bg-2);transition:transform .5s var(--ease)}
.section:not(.section-alt) .tt-dot,.page .tt-dot{background:var(--bg)}
.tt-dot i{width:16px;height:16px;transform:rotate(45deg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tt:hover .tt-dot{transform:translateY(-4px)}
.t-member .tt-dot i{background:linear-gradient(135deg,#9A2A2F,#5E0006)}
.t-silver .tt-dot i{background:linear-gradient(135deg,#F2F4F5,#9AA6AB)}
.t-gold .tt-dot i{background:linear-gradient(135deg,#F2D48C,#B88A3E)}
.t-platinum .tt-dot i{background:linear-gradient(135deg,#EEF3F4,#A9B9BE 55%,#7D8F95)}
.tt b{margin-top:10px;font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.3}
.tt small{font-size:.8rem;color:var(--ink-3)}
.tt.on .tt-dot{outline:1px solid var(--petrol);outline-offset:5px}
.tt-here{position:absolute;top:-30px;font-size:.72rem;padding:2px 9px;background:var(--petrol);color:var(--cream);white-space:nowrap}
.tt-note{margin-top:26px;font-size:.82rem;color:var(--ink-3);text-align:center}
.rw-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.rw-head h3{font-size:clamp(1.4rem,2.4vw,1.8rem)}
.rw-head span{font-size:.85rem;color:var(--ink-3)}
.rw-list{border-top:1px solid var(--line-2)}
.rw{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);transition:padding .45s var(--ease),background-color .3s}
.rw:hover{padding-inline-start:14px}
.rw-cost{display:flex;align-items:baseline;gap:8px}
.rw-cost b{font-family:var(--f-body);font-weight:200;font-size:2.5rem;line-height:1;color:var(--petrol)}
.rw-cost small{font-size:.8rem;color:var(--gold)}
.rw-txt b{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.35}
.rw-txt b .ic{color:var(--gold);width:20px;height:20px;stroke-width:1.4}
.rw-txt p{margin-top:2px;font-size:.92rem;color:var(--ink-2)}
.rw-need{font-size:.8rem;color:var(--ink-3);white-space:nowrap}
/* numerals read better in the body face */
.num,.price b,.stat b,.kpi b,.band-copy .buy b,.countdown span,.sum-total .num,.member-card b.num{font-family:var(--f-body);font-weight:300}
.price b,.stat b,.band-copy .buy b{font-weight:200}
@media (max-width:920px){
  .loyal{grid-template-columns:1fr}
}
@media (max-width:640px){
  .tier-track{grid-template-columns:1fr;padding-top:0;gap:0}
  .tier-track::before,.tier-track::after{top:23px;bottom:23px;inset-inline-start:22px;width:1px;height:auto}
  .tier-track::after{width:2px;margin:0 0 0 -.5px;transform:scaleY(var(--fill,1));transform-origin:top}
  .tier-track.in::after{animation-name:trackInY}
  @keyframes trackInY{from{transform:scaleY(0)}}
  .tt{grid-template-columns:46px 1fr;justify-items:start;text-align:start;column-gap:16px;row-gap:0;padding:0 0 18px}
  .tt-dot{grid-row:span 2}
  .tt b{margin-top:0;align-self:end}

/* ───────── core: helpers, storage, i18n, shell, modals, effects ───────── */
const $ = (s, r = document) => r.querySelector(s);

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DAY = 864e5;

const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const toLatin = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const normPhone = v => { let p = toLatin(v).replace(/\D/g, ''); if (p.startsWith('00968')) p = p.slice(5); else if (p.startsWith('968') && p.length === 11) p = p.slice(3); return p; };
const validPhone = p => /^[279]\d{7}$/.test(p);
const phoneLabel = p => `\u2066+968 ${String(p).slice(0, 4)} ${String(p).slice(4)}\u2069`;
const waLink = (phone, text) => `https://wa.me/968${phone}?text=${encodeURIComponent(text || '')}`;
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const daysUntil = iso => { const a = new Date(dayKey(new Date())), b = new Date(dayKey(iso)); return Math.round((b - a) / DAY); };

/* prefs (per-browser conveniences) */
const prefs = {
  get(k, d) { try { const v = localStorage.getItem('maseer.' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { v == null || v === '' ? localStorage.removeItem('maseer.' + k) : localStorage.setItem('maseer.' + k, v); } catch (e) {} }
};

/* data store — one JSON document; swap these two functions for a backend (Firebase/Supabase) */
const KEY = 'maseer.v1';
const blankDB = () => ({ v: 1, seq: 1000, users: {}, orders: [], gifts: [], alerts: [], notifs: [], carts: {}, broadcasts: [] });
let DB = blankDB();
function loadDB() { try { const raw = localStorage.getItem(KEY); if (raw) { DB = Object.assign(blankDB(), JSON.parse(raw)); return true; } } catch (e) {} DB = blankDB(); return false; }
function saveDB() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }

/* state */
const S = {
  lang: prefs.get('lang', 'ar'), theme: prefs.get('theme', ''), phone: prefs.get('session', ''),
  route: 'home', cycle: 'monthly', ordersTab: 'all', adminTab: 'overview', adminFilter: 'all', adminQ: '',
  after: null, pending: null, chatOpen: false, chat: [], installEvt: null, menu: null
};

/* i18n */
const t = (k, v) => {
  let s = (I18N[S.lang] && I18N[S.lang][k]) ?? I18N.ar[k] ?? k;
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
};
const L = o => o == null ? '' : typeof o === 'string' ? o : (o[S.lang] ?? o.ar ?? '');
const locale = () => S.lang === 'ar' ? 'ar-OM' : 'en-GB';
const N = (n, d = 0) => new Intl.NumberFormat(locale(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(+n || 0);
const OMR = n => `${N(n, 3)} ${t('omr')}`;
const fmtDate = (iso, o = { day: 'numeric', month: 'long', year: 'numeric' }) => new Intl.DateTimeFormat(locale(), o).format(new Date(iso));
const fmtShort = iso => fmtDate(iso, { day: 'numeric', month: 'short' });
const fmtDT = iso => fmtDate(iso, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const hourLabel = h => new Intl.DateTimeFormat(locale(), { hour: 'numeric' }).format(new Date(2026, 0, 1, h));
const slotLabel = s => { if (!s) return ''; const [a, b] = s.split('-').map(Number); return `${hourLabel(a)} – ${hourLabel(b)}`; };
const ago = iso => {
  const s = (Date.now() - new Date(iso)) / 1000, rtf = new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' });
  if (s < 60) return t('justNow');
  if (s < 3600) return rtf.format(-Math.round(s / 60), 'minute');
  if (s < 86400) return rtf.format(-Math.round(s / 3600), 'hour');
  return rtf.format(-Math.round(s / 86400), 'day');
};
const daysTxt = n => { n = Math.abs(n); if (S.lang !== 'ar') return n === 1 ? '1 day' : `${N(n)} days`; if (n === 1) return 'يوم واحد'; if (n === 2) return 'يومين'; const m = n % 100; return m >= 3 && m <= 10 ? `${N(n)} أيام` : `${N(n)} يومًا`; };
const inDays = n => n === 0 ? t('today') : n === 1 ? t('tomorrow') : n < 0 ? t('daysAgo', { d: daysTxt(-n) }) : t('inDays', { d: daysTxt(n) });
const areaLabel = v => { for (const g of AREAS) for (const w of g.w) if (w[1] === v) return S.lang === 'ar' ? w[0] : w[1]; return v || ''; };

/* domain helpers */
const me = () => (S.phone && DB.users[S.phone]) || null;
const isAdmin = () => !!me() && S.phone === ADMIN_PHONE;
const activePlan = u => (u && u.membership && u.membership.status === 'active' && new Date(u.membership.endAt) > new Date()) ? PLAN[u.membership.planId] : null;
const discountFor = (u, svcId) => { const p = activePlan(u); if (!p) return 0; const cat = SVC[svcId] && SVC[svcId].cat; return Math.max(p.disc.all || 0, p.disc[cat] || 0); };
const tierOf = pts => [...TIERS].reverse().find(x => pts >= x.min);
const nextTier = pts => TIERS.find(x => x.min > pts);
const planPrice = (id, cycle) => cycle === 'yearly' ? Math.round(PLAN[id].price * 12 * (1 - YEARLY_OFF) * 1000) / 1000 : PLAN[id].price;
const cartOf = phone => (DB.carts[phone] = DB.carts[phone] || []);
const unreadCount = () => myNotifs().filter(n => !n.read && !(n.readBy || []).includes(S.phone)).length;
const myNotifs = () => DB.notifs.filter(n => n.phone === S.phone || (n.phone === '*' && !isAdmin()));
const carLabel = c => c ? [c.make, c.model, c.year ? N(c.year).replace(/[٬,]/g, '') : ''].filter(Boolean).join(' ') : '';
const itemTitle = o => o.kind === 'membership' || (o.kind === 'gift' && o.planId) ? `${L(PLAN[o.planId].name)} · ${t(o.cycle === 'yearly' ? 'yearly' : 'monthly')}`
  : o.kind === 'upgrade' ? t('upgradeReq') : L(SVC[o.svc] && SVC[o.svc].name);
const itemIcon = o => o.kind === 'membership' ? 'crown' : o.kind === 'upgrade' ? 'up' : o.kind === 'gift' ? 'gift' : (SVC[o.svc] ? SVC[o.svc].icon : 'wrench');
const optLabels = o => { const s = SVC[o.svc]; if (!s || !o.opts) return []; return o.opts.map(id => { const x = s.options.find(y => y.id === id); return x ? L(x) : id; }); };

function newUser(phone, name) {
  return { phone, name: name || '', createdAt: now(), cars: [], points: 0, earned: 0, log: [], membership: null, pendingPlan: null, coupons: 0, priority: 0 };
}
function notify(phone, key, vars = {}, icon = 'bell', go = '') {
  DB.notifs.unshift({ id: uid(), phone, key, vars, icon, go, at: now(), read: false });
  if (DB.notifs.length > 400) DB.notifs.length = 400;
}
const resolveVars = v => { const o = {}; for (const k in v || {}) { const x = v[k]; o[k] = x && typeof x === 'object' ? (x.t ? esc(t(x.t)) : x.d ? esc(fmtDate(x.d)) : x.omr != null ? esc(OMR(x.omr)) : esc(L(x))) : typeof x === 'number' ? N(x) : esc(x); } return o; };
const notifText = n => n.raw ? { title: esc(n.raw.title), body: esc(n.raw.body) } : { title: t(n.key + '_t', resolveVars(n.vars)), body: t(n.key + '_b', resolveVars(n.vars)) };
function deviceNotify(title, body) {
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon: 'icons/icon-192.png', lang: S.lang, dir: S.lang === 'ar' ? 'rtl' : 'ltr' }); } catch (e) {}
}

function priceOrder(o) {
  if (o.free) { o.total = 0; return; }
  if (o.base == null || o.base === '') { o.total = null; return; }
  const d = (+o.discPct || 0) / 100, c = (+o.coupon || 0) / 100;
  o.total = Math.round(+o.base * (1 - d) * (1 - c) * 1000) / 1000;
}
function setStatus(o, s) {
  if (o.status === s) return;
  o.status = s; o.history.push({ s, at: now() }); o.updatedAt = now();
  const u = DB.users[o.phone];
  if (s === 'done' && u) {
    if (!o.pointsAwarded && o.total > 0) {
      const pts = Math.floor(o.total * POINTS_PER_OMR);
      if (pts > 0) {
        u.points += pts; u.earned += pts; o.pointsAwarded = pts;
        u.log.unshift({ id: uid(), delta: pts, why: 'order', no: o.no, at: now() });
        notify(o.phone, 'n_points', { pts, no: o.no }, 'star', 'rewards');
      }
    }
    if (o.kind === 'membership') {
      const days = o.cycle === 'yearly' ? 365 : 30;
      u.membership = { planId: o.planId, cycle: o.cycle, status: 'active', startAt: now(), endAt: new Date(Date.now() + days * DAY).toISOString(), orderId: o.id };
      if (u.pendingPlan && u.pendingPlan.orderId === o.id) u.pendingPlan = null;
      notify(o.phone, 'n_plan_on', { plan: PLAN[o.planId].name }, 'crown', 'account');
    }
  }
  if (s === 'cancelled' && u && u.pendingPlan && u.pendingPlan.orderId === o.id) u.pendingPlan = null;
  notify(o.phone, 'n_status', { no: o.no, s: { t: 'st_' + s } }, s === 'done' ? 'check' : s === 'cancelled' ? 'x' : 'clock', 'orders');
}
function createOrder(phone, item, extra = {}) {
  const u = DB.users[phone];
  const o = Object.assign({
    id: uid(), no: 'MS-' + (++DB.seq), phone, kind: item.kind || 'service', svc: item.svc || null, opts: item.opts || [], extras: item.extras || {},
    car: item.car || null, date: item.date || null, slot: item.slot || null, urgent: !!item.urgent, area: item.area || '', address: item.address || '',
    map: item.map || '', notes: item.notes || '', planId: item.planId || null, cycle: item.cycle || null, free: !!item.free, giftCode: item.giftCode || null,
    reward: item.reward || null, base: null, discPct: 0, coupon: 0, total: null, priority: false, pay: 'later', status: 'new',
    history: [{ s: 'new', at: now() }], createdAt: now(), updatedAt: now(), pointsAwarded: 0
  }, extra);
  if (o.kind === 'service') o.discPct = discountFor(u, o.svc);
  if ((o.kind === 'membership' || (o.kind === 'gift' && o.planId)) && !o.free) { o.base = planPrice(o.planId, o.cycle); o.discPct = 0; }
  priceOrder(o);
  DB.orders.unshift(o);
  if (o.kind === 'membership' && u) u.pendingPlan = { planId: o.planId, cycle: o.cycle, orderId: o.id };
  notify(ADMIN_PHONE, 'n_admin_new', { no: o.no, name: (u && u.name) || phoneLabel(phone), what: o.kind === 'service' ? SVC[o.svc].name : { ar: itemTitleAr(o), en: itemTitleEn(o) } }, 'cart', 'admin');
  return o;
}
function itemTitleAr(o) { const l = S.lang; S.lang = 'ar'; const r = itemTitle(o); S.lang = l; return r; }
function itemTitleEn(o) { const l = S.lang; S.lang = 'en'; const r = itemTitle(o); S.lang = l; return r; }

/* demo records so the admin panel opens in a working state — clearly marked, one click to clear */
function seedDemo() {
  const ago_ = (d, h = 10) => new Date(Date.now() - d * DAY - (Date.now() % DAY) + h * 36e5).toISOString();
  const people = [
    ['90000001', 'سالم الحارثي', { id: uid(), make: 'Toyota', model: 'Land Cruiser', year: '2022', plate: '45821', letters: 'أ ب' }],
    ['90000002', 'مريم البلوشية', { id: uid(), make: 'Hyundai', model: 'Tucson', year: '2021', plate: '7310', letters: 'ر س' }],
    ['90000003', 'خالد الرواحي', { id: uid(), make: 'Nissan', model: 'Patrol', year: '2019', plate: '12094', letters: 'د م' }]
  ];
  for (const [p, n, car] of people) { const u = newUser(p, n); u.cars.push(car); u.demo = true; u.createdAt = ago_(14); DB.users[p] = u; }

    o.demo = true; o.createdAt = ago_(d, 9 + (d % 5)); o.history = [{ s: 'new', at: o.createdAt }];
    if (base != null) { o.base = base; priceOrder(o); }

  };
  mk('90000001', { kind: 'membership', planId: 'comfort', cycle: 'monthly' }, 12, 'done');
  mk('90000001', { svc: 'maintenance', opts: ['oil'], extras: { km: '84200' } }, 10, 'done', 24);

function confetti(n = 140) {
  if (REDUCED) return;
  const c = $('#confetti'), x = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ['#F4B23E', '#FFF6E3', '#5E0006', '#3E8A9A', '#E0951C', '#9CC7CF'];
  const P = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 5, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[n++ % cols.length], d: Math.random() < .5 }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.d) { x.beginPath(); x.moveTo(0, -p.s / 2); x.lineTo(p.s / 2, 0); x.lineTo(0, p.s / 2); x.lineTo(-p.s / 2, 0); x.fill(); } else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      x.restore();
    }
    if (++f < 190) requestAnimationFrame(tick); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ───────── motion helpers ───────── */
let revealObs;
function setupReveal(root) {
  if (REDUCED || !('IntersectionObserver' in window)) return;
  if (revealObs) revealObs.disconnect();
  const seen = new WeakSet();
  revealObs = new IntersectionObserver(es => {
    for (const e of es) {
      if (!seen.has(e.target)) { seen.add(e.target); if (e.isIntersecting) { revealObs.unobserve(e.target); countUp(e.target); continue; } }
      if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); countUp(e.target); }
    }
  }, { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  $$('.reveal', root).forEach(el => revealObs.observe(el));
}
function countUp(scope) {
  $$('[data-count]', scope).forEach(el => {
    if (el.dataset.counted) return; el.dataset.counted = 1;
    const to = +el.dataset.count, d = +(el.dataset.dec || 0), dur = 1400, t0 = performance.now();
    if (REDUCED) { el.textContent = N(to, d); return; }
    (function step(tm) { const k = Math.min(1, (tm - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = N(to * e, d); if (k < 1) requestAnimationFrame(step); })(t0);
  });
}

const shell = html => `<div class="page"><div class="wrap shell">${railNav()}<div class="stack" style="gap:22px;min-width:0">${html}</div></div></div>`;

function tracker(o) {
  if (o.status === 'cancelled') return `<div class="row" style="color:var(--bad);font-size:.88rem">${ic('x')}${esc(t('cancelledOn', { d: fmtShort(o.updatedAt) }))}</div>`;
  const seq = ['new', 'progress', 'done'], idx = seq.indexOf(o.status), all = o.status === 'done';
  return `<div class="track" style="--prog:${idx / 2}">${seq.map((s, i) => { const done = all || i < idx, nowS = !all && i === idx;
    return `<div class="track-step ${done ? 'done' : nowS ? 'now' : ''}"><i>${done ? ic('check') : N(i + 1)}</i><span>${esc(t('st_' + s))}</span></div>`; }).join('')}</div>`;
}
function whenLabel(o) {
  if (o.urgent) return t('asap');
  if (!o.date) return o.kind === 'service' ? '—' : fmtShort(o.createdAt);
  return `${fmtDate(o.date, { weekday: 'short', day: 'numeric', month: 'short' })}${o.slot ? ' · ' + slotLabel(o.slot) : ''}`;
}
const priceLabel = o => o.free ? t('free') : o.total == null ? t('awaitingPrice') : OMR(o.total);
function orderCard(o) {

}

  const rows = [];

const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
const loadScript = src => new Promise((res, rej) => { if ($(`script[src="${src}"]`) && window.__loaded && window.__loaded[src]) return res(); const s = document.createElement('script'); s.src = src; s.onload = () => { (window.__loaded = window.__loaded || {})[src] = 1; res(); }; s.onerror = rej; document.head.appendChild(s); });
async function downloadPdf(o, btn) {
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `${ic('refresh')}${esc(t('preparing'))}`;
  try {
    for (const s of LIBS) await loadScript(s);
    const el = $('#invoiceEl');
    const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 30, w = pw - m * 2, h = canvas.height * w / canvas.width;
    pdf.addImage(canvas.toDataURL('image/jpeg', .95), 'JPEG', m, m, w, Math.min(h, ph - m * 2));
    await saveFile(`Maseer-${o.no}.pdf`, pdf.output('blob'));
  } catch (e) { console.error(e); toast(esc(t('pdfFail')), 'bad'); }
  finally { btn.disabled = false; btn.innerHTML = label; }
}
async function saveFile(name, blob) {
  const host = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (host) {
    try { await host.save({ filename: name, data: blob }); toast(esc(t('saved'))); }
    catch (e) { if (!e || e.code !== 'declined') toast(esc(t('pdfFail')), 'bad'); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast(esc(t('saved')));
}

function readSvcForm(f) {

    if (x.req && !v) return { err: t('fillX', { x: L(x) }) };
    if (v) extras[x.id] = v;
  }
  let car = null; const cv = fd.get('car');

  const urgent = s.sched === 'urgent' && fd.get('when') !== 'schedule';

  return { item: { kind: 'service', svc: s.id, opts, extras, car, date, slot, urgent, area, address: String(fd.get('address') || '').trim(), map: String(fd.get('map') || '').trim(), notes: String(fd.get('notes') || '').trim() } };

const ROUTES = {
  home: { r: vHome }, services: { r: vServices }, plans: { r: vPlans }, login: { r: vLogin },
  account: { r: vAccount, auth: 1 }, orders: { r: vOrders, auth: 1 }, alerts: { r: vAlerts, auth: 1 },
  rewards: { r: vRewards }, gifts: { r: vGifts }, story: { r: vStory }, promise: { r: vPromise }, why: { r: vWhy }, faq: { r: vFaq }, prefs: { r: vPrefs }, cart: { r: vCart, auth: 1 }, admin: { r: vAdmin, admin: 1 }
};
let timers = [];
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };
function go(name) { if ((location.hash.slice(1) || 'home') === name) route(); else location.hash = name; }
function route() {
  let name = location.hash.slice(1) || 'home';
  if (!ROUTES[name]) name = 'home';
  const R = ROUTES[name];
  if (R.auth && !me()) { S.after = name; return go('login'); }
  if (R.auth && isAdmin() && name !== 'account') return go('admin');
  if (R.admin && !isAdmin()) return go(me() ? 'account' : 'login');
  if (name === 'login' && me()) return go(isAdmin() ? 'admin' : 'account');
  const changed = S.route !== name;
  S.route = name; S.menu = null; S.drawer = false;
  renderAll();
  if (changed && !S.scrollTo) window.scrollTo(0, 0);
}
function renderView() {
  clearTimers();
  $('#view').innerHTML = ROUTES[S.route].r();
  afterRender();
}
function renderAll() { applyLang(); applyTheme(); renderTop(); renderView(); renderTabbar(); renderFooter(); renderChat(); renderDrawer(); document.body.dataset.route = S.route; }
function refresh() { renderTop(); renderView(); renderTabbar(); }
function afterRender() {
  const v = $('#view');
  setupReveal(v); positionKnob();
  if (S.scrollTo) { const el = document.getElementById(S.scrollTo); S.scrollTo = null; if (el) setTimeout(() => el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }), 60); }
  if (S.route === 'home' || S.route === 'prefs') homeMotion();
  if (S.route === 'login') { const f = $('#ph') || $('#nm'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 120); }
  if (S.route === 'account' || S.route === 'rewards' || S.route === 'admin') countUp(v);
}
function homeMotion() {
  const dash = $('#dash'); if (dash) countUp(dash);
  const td = $('#toastDemo'); let k = 0;
  if (td) td.addEventListener('animationiteration', () => { k = (k + 1) % DEMO_TOASTS.length; const d = DEMO_TOASTS[k]; td.innerHTML = `<span class="ti">${ic(d.i)}</span><span><b>${esc(t(d.t))}</b><small>${esc(t(d.s))}</small></span>`; });
  let auto = 0;
  if (!REDUCED) timers.push(setInterval(() => { if (S.alertDemoTouched) return; const ids = ALERT_TYPES.map(a => a.id); pushDemo(ids[auto++ % ids.length]); }, 3600));
  timers.push(setInterval(() => { const pt = $('#phoneTime'); if (pt) pt.textContent = new Intl.DateTimeFormat(locale(), { hour: 'numeric', minute: '2-digit', hour12: false }).format(new Date()); }, 15000));
}
function pushDemo(type) {

  const p = S.pending; S.pending = null;
  if (p) {
    if (p.type === 'cart' || p.type === 'now') {
      rememberCar(p.item.car);
      if (p.type === 'now') { const o = createOrder(phone, p.item); saveDB(); go('orders'); setTimeout(() => successModal(o), 300); return; }
      cartOf(phone).push(Object.assign({ key: uid() }, p.item)); saveDB(); return go('cart');
    }
    if (p.type === 'subscribe') { saveDB(); go('plans'); setTimeout(() => openSubscribe(p.planId, p.cycle), 300); return; }
    if (p.type === 'gift') { saveDB(); go('gifts'); setTimeout(() => openGiftForm(p.kind, p.ref), 300); return; }
  }
  saveDB(); checkAlerts();
  const after = S.after; S.after = null;
  go(isAdmin() ? 'admin' : after && after !== 'login' ? after : 'account');
}

/* ───────── alerts engine ───────── */
function checkAlerts() {
  if (!me()) return;
  const today = dayKey(new Date()); let fired = 0;
  for (const a of myAlerts()) {
    if (a.done || a.notifiedOn === today) continue;
    const n = daysUntil(a.date);
    if (n <= a.remind) {
      a.notifiedOn = today; fired++;
      notify(S.phone, 'n_alert', { type: ATYPE[a.type].name, d: { d: a.date } }, ATYPE[a.type].icon, 'alerts');
      deviceNotify(L(ATYPE[a.type].name), t('n_alert_b', { type: L(ATYPE[a.type].name), d: fmtDate(a.date) }));
    }
  }
  if (fired) { saveDB(); renderTop(); const b = $('#bellBtn'); if (b) b.classList.add('ring'); }
}

  },
  redeem: el => {
    const r = REWARD[el.dataset.id], u = me(); if (!u || u.points < r.cost) return;
    confirmModal(t('redeemQ', { r: L(r.name), n: N(r.cost) }), t('redeem'), () => redeem(r));
  },
  'gift-new': el => {
    const kind = el.dataset.kind || 'service', ref = el.dataset.ref;
    if (!me()) { S.pending = { type: 'gift', kind, ref }; toast(esc(t('loginToFinish')), 'info', 'user'); closeModal(); return go('login'); }
    openGiftForm(kind, ref);
  },
  'gift-claim': el => claimGift(el.dataset.code),
  'gift-cancel': el => confirmModal(t('cancelGiftQ'), t('cancelGift'), () => {
    const g = DB.gifts.find(x => x.code === el.dataset.code); if (!g || g.status !== 'sent') return;
    g.status = 'cancelled'; const o = DB.orders.find(x => x.id === g.orderId); if (o && o.status === 'new') setStatus(o, 'cancelled');
    saveDB(); toast(esc(t('giftCancelled')), 'info', 'x'); refresh();
  }, true),
  'admin-tab': el => { S.adminTab = el.dataset.tab; renderView(); },
  'admin-filter': el => { S.adminFilter = el.dataset.f; renderView(); },
  'admin-order': el => openAdminOrder(el.dataset.id),
  'admin-user': el => openAdminUser(el.dataset.phone),
  'admin-status': el => {
    const o = DB.orders.find(x => x.id === el.dataset.id); if (!o) return;
    setStatus(o, el.dataset.s); saveDB();
    toast(esc(t('statusSaved', { s: t('st_' + o.status) })) + (o.pointsAwarded && el.dataset.s === 'done' ? ' · ' + esc(t('earnedPts', { n: N(o.pointsAwarded) })) : ''), 'ok');
    if (el.dataset.s === 'done') confetti(80);
    openAdminOrder(o.id); renderView(); renderTop();
  },
  'demo-clear': () => confirmModal(t('clearDemoQ'), t('clearDemo'), () => { clearDemo(); saveDB(); toast(esc(t('demoCleared')), 'ok'); refresh(); }, true)
};
function markRead(n) { if (n.phone === '*') { n.readBy = n.readBy || []; if (!n.readBy.includes(S.phone)) n.readBy.push(S.phone); } else n.read = true; }
function redeem(r) {
  const u = me(); if (u.points < r.cost) return;
  u.points -= r.cost; u.log.unshift({ id: uid(), delta: -r.cost, why: r.id, at: now() });
  if (r.id === 'disc5') u.coupons = (u.coupons || 0) + 1;
  if (r.id === 'priority') u.priority = (u.priority || 0) + 1;
  if (r.id === 'upgrade') { const o = createOrder(S.phone, { kind: 'upgrade', notes: t('upgradeNote', { plan: activePlan(u) ? L(activePlan(u).name) : '—' }) }); o.free = true; priceOrder(o); }
  confetti(90);
  if (r.id === 'wash') {
    const key = uid(); cartOf(S.phone).push({ key, kind: 'service', svc: 'wash', opts: ['ext'], extras: {}, free: true, reward: 'wash', needsDetails: true });
    saveDB(); toast(esc(t('redeemed', { r: L(r.name) })), 'ok', 'star'); go('cart');
    setTimeout(() => { const it = cartOf(S.phone).find(x => x.key === key); if (it) openServiceSheet('wash', { key, item: it }); }, 350);
    return;
  }
  saveDB(); toast(esc(t('redeemed', { r: L(r.name) })), 'ok', 'star'); refresh();
}
function claimGift(code) {
  code = String(code || '').trim().toUpperCase();
  const g = DB.gifts.find(x => x.code === code);
  if (!g) return toast(esc(t('giftNotFound')), 'bad');
  if (g.status === 'claimed') return toast(esc(t('giftUsed')), 'bad');
  if (g.status === 'cancelled') return toast(esc(t('giftCancelledErr')), 'bad');
  if (g.from === S.phone) return toast(esc(t('giftOwn')), 'bad');
  g.status = 'claimed'; g.claimedBy = S.phone; g.claimedAt = now();
  const key = uid();
  if (g.item.kind === 'plan') cartOf(S.phone).push({ key, kind: 'membership', planId: g.item.planId, cycle: g.item.cycle, free: true, giftCode: g.code });
  else cartOf(S.phone).push({ key, kind: 'service', svc: g.item.svc, opts: [SVC[g.item.svc].options[0].id], extras: {}, free: true, giftCode: g.code, needsDetails: true });
  notify(g.from, 'n_gift_claimed', { name: me().name, item: g.item.kind === 'plan' ? PLAN[g.item.planId].name : SVC[g.item.svc].name }, 'gift', 'gifts');
  saveDB(); confetti(); toast(esc(t('giftClaimed')), 'ok', 'gift'); go('cart');
  if (g.item.kind !== 'plan') setTimeout(() => { const it = cartOf(S.phone).find(x => x.key === key); if (it) openServiceSheet(it.svc, { key, item: it }); }, 350);
}

/* ───────── forms ───────── */
const FORMS = {
  'login-phone': f => {
    const p = normPhone(f.phone.value); S.loginPhone = f.phone.value;
    if (!validPhone(p)) { $('#phErr').textContent = t('phoneErr'); f.phone.focus(); return; }
    if (DB.users[p]) return login(p);
    if (p === ADMIN_PHONE) { DB.users[p] = newUser(p, t('adminName')); return login(p); }
    S.loginStep = 'profile'; S.loginPhone = p; renderView();
  },
  'login-profile': f => {
    const name = f.name.value.trim();
    if (name.length < 2) { $('#nmErr').textContent = t('nameErr'); f.name.focus(); return; }
    const u = newUser(S.loginPhone, name), car = readCar(new FormData(f)); if (car) u.cars.push(car);
    DB.users[S.loginPhone] = u;
    notify(S.loginPhone, 'n_welcome', {}, 'sparkle', 'services');
    notify(ADMIN_PHONE, 'n_admin_user', { name, p: phoneLabel(S.loginPhone) }, 'user', 'admin');
    login(S.loginPhone);
  },
  svc: (f, sub) => {
    const r = readSvcForm(f); if (r.err) return toast(esc(r.err), 'bad', 'info');
    const mode = sub && sub.value || 'cart', key = f.dataset.key;
    if (!me()) { S.pending = { type: mode === 'now' ? 'now' : 'cart', item: r.item }; closeModal(); toast(esc(t('loginToFinish')), 'info', 'user'); return go('login'); }
    rememberCar(r.item.car);
    if (key) {
      const it = cartOf(S.phone).find(x => x.key === key);
      if (it) Object.assign(it, r.item, { needsDetails: false, free: it.free, giftCode: it.giftCode, reward: it.reward });
      saveDB(); closeModal(); toast(esc(t('savedToCart')), 'ok', 'cart'); return refresh();
    }
    if (mode === 'now') { const o = createOrder(S.phone, r.item); saveDB(); closeModal(); refresh(); setTimeout(() => successModal(o), 260); return; }
    cartOf(S.phone).push(Object.assign({ key: uid() }, r.item)); saveDB(); closeModal(); renderTop(); renderTabbar();
    const cb = $('#cartBtn'); if (cb) cb.classList.add('bump');
    toast(`${esc(t('addedToCart'))} · <a class="link" href="#cart" style="color:var(--accent)">${esc(t('viewCart'))}</a>`, 'ok', 'cart');
  },
  subscribe: f => {
    const fd = new FormData(f), o = createOrder(S.phone, { kind: 'membership', planId: f.dataset.plan, cycle: fd.get('cycle') }, { pay: fd.get('pay') });
    saveDB(); closeModal(); refresh(); setTimeout(() => successModal(o, t('subReceived')), 260);
  },
  checkout: f => {
    const u = me(), cart = cartOf(S.phone), fd = new FormData(f);
    if (cart.some(i => i.needsDetails)) return toast(esc(t('completeFirst')), 'bad', 'info');
    let useCoupon = fd.get('coupon') && u.coupons > 0, usePrio = fd.get('priority') && u.priority > 0;
    const made = cart.map(i => {
      const o = createOrder(S.phone, i, { pay: fd.get('pay') || 'later' });
      if (useCoupon && o.kind === 'service' && !o.free) { o.coupon = 5; u.coupons--; useCoupon = false; priceOrder(o); }
      if (usePrio) { o.priority = true; u.priority--; usePrio = false; }
      return o;
    });
    DB.carts[S.phone] = []; saveDB(); go('orders'); setTimeout(() => successModal(made), 260);
  },
  alert: f => {
    const fd = new FormData(f), id = f.dataset.id, date = fd.get('date');
    if (!date) return toast(esc(t('pickDate')), 'bad');
    const data = { type: fd.get('type'), date, remind: +fd.get('remind') || 7, carId: fd.get('car') || '', note: String(fd.get('note') || '').trim() };
    if (id) { const a = DB.alerts.find(x => x.id === id); Object.assign(a, data, { notifiedOn: null }); }
    else DB.alerts.push(Object.assign({ id: uid(), phone: S.phone, createdAt: now(), done: false }, data));
    saveDB(); closeModal(); toast(esc(t('alertSaved')), 'ok', 'bell'); refresh(); checkAlerts();
  },
  car: f => { const c = readCar(new FormData(f)); if (!c) return toast(esc(t('carErr')), 'bad'); me().cars.push(c); saveDB(); closeModal(); toast(esc(t('carSaved')), 'ok', 'car'); refresh(); },
  'gift-code': f => { claimGift(f.code.value); },
  gift: f => {
    const fd = new FormData(f), u = me(), toPhone = normPhone(fd.get('toPhone')), toName = String(fd.get('toName') || '').trim();
    if (!toName) return toast(esc(t('friendNameErr')), 'bad');
    if (!validPhone(toPhone)) return toast(esc(t('phoneErr')), 'bad');
    if (toPhone === S.phone) return toast(esc(t('giftSelf')), 'bad');
    const kind = fd.get('gkind') === 'plan' ? 'plan' : 'service';
    const item = kind === 'plan' ? { kind, planId: fd.get('plan'), cycle: fd.get('cycle') } : { kind, svc: fd.get('svc') };
    const g = { code: newGiftCode(), from: S.phone, fromName: u.name, toName, toPhone, message: String(fd.get('message') || '').trim(), occasion: fd.get('occasion') || 'none', item, status: 'sent', createdAt: now() };
    const o = createOrder(S.phone, kind === 'plan' ? { kind: 'gift', planId: item.planId, cycle: item.cycle } : { kind: 'gift', svc: item.svc, opts: [] }, { giftCode: g.code, giftTo: toName });
    if (kind === 'service') { o.discPct = discountFor(u, item.svc); }
    g.orderId = o.id; DB.gifts.unshift(g);
    notify(toPhone, 'n_gift', { name: u.name, item: kind === 'plan' ? PLAN[item.planId].name : SVC[item.svc].name }, 'gift', 'gifts');
    saveDB(); confetti();
    openModal(`<div class="modal-body" style="padding:28px 22px"><div class="stack" style="justify-items:center;text-align:center;gap:16px">
      <h3 style="font-size:1.5rem">${esc(t('giftReady'))}</h3>
      <div class="gift-card" style="max-width:340px;padding:20px"><svg class="g-logo" viewBox="0 0 862 290" aria-hidden="true" style="width:96px"><use href="#logo"/></svg><div class="g-occ" style="font-size:1.2rem">${esc(L(OCC[g.occasion].name))} · ${esc(toName)}</div><div class="g-code" id="giftCodeTxt">${g.code}</div></div>
      <p class="muted" style="max-width:28em">${esc(t('giftReadySub'))}</p>
    </div></div>
    <div class="modal-foot"><a class="btn btn-wa" href="${giftWa(g)}" target="_blank" rel="noopener">${ic('wa')}${esc(t('shareWa'))}</a><button class="btn btn-outline" data-act="copy" data-copy="${g.code}" type="button">${ic('copy')}${esc(t('copyCode'))}</button><a class="btn btn-ghost" href="#gifts" data-act="close-go" data-to="gifts">${esc(t('myGifts'))}</a></div>`);
  },
  'admin-price': f => {
    const o = DB.orders.find(x => x.id === f.dataset.id), base = parseFloat(toLatin(f.base.value).replace(/[^\d.]/g, ''));
    if (!(base >= 0)) return toast(esc(t('priceErr')), 'bad');
    o.base = Math.round(base * 1000) / 1000; o.discPct = Math.min(100, Math.max(0, parseFloat(toLatin(f.disc.value)) || 0)); priceOrder(o); o.updatedAt = now();
    notify(o.phone, 'n_price', { no: o.no, total: { omr: o.total } }, 'receipt', 'orders');
    saveDB(); toast(esc(t('priceSaved', { x: OMR(o.total) })), 'ok', 'tag'); openAdminOrder(o.id); renderView(); renderTop();
  },
  'admin-plan': f => {
    const u = DB.users[f.dataset.phone], pid = f.plan.value, cyc = f.cycle.value;
    if (!pid) { u.membership = null; u.pendingPlan = null; }
    else { u.membership = { planId: pid, cycle: cyc, status: 'active', startAt: now(), endAt: new Date(Date.now() + (cyc === 'yearly' ? 365 : 30) * DAY).toISOString(), byAdmin: true }; u.pendingPlan = null; notify(u.phone, 'n_plan_on', { plan: PLAN[pid].name }, 'crown', 'account'); }
    saveDB(); toast(esc(t('saved')), 'ok'); openAdminUser(u.phone); renderView();
  },
  'admin-points': f => {
    const u = DB.users[f.dataset.phone], d = parseInt(toLatin(f.delta.value).replace(/[^\d-]/g, ''), 10);
    if (!d) return toast(esc(t('pointsErr')), 'bad');
    u.points = Math.max(0, u.points + d); if (d > 0) u.earned += d;
    u.log.unshift({ id: uid(), delta: d, why: 'admin', note: f.note.value.trim(), at: now() });
    notify(u.phone, d > 0 ? 'n_points_add' : 'n_points_sub', { pts: Math.abs(d) }, 'star', 'rewards');
    saveDB(); toast(esc(t('saved')), 'ok'); openAdminUser(u.phone); renderView();
  },
  broadcast: f => {
    const title = f.title.value.trim(), body = f.body.value.trim(); if (!title || !body) return toast(esc(t('offerErr')), 'bad');
    DB.broadcasts.unshift({ id: uid(), title, body, at: now() });
    DB.notifs.unshift({ id: uid(), phone: '*', raw: { title, body }, icon: 'mega', go: 'services', at: now(), read: false, readBy: [] });
    saveDB(); toast(esc(t('offerSent')), 'ok', 'mega'); renderView();
  },
  chat: f => { const q = f.q.value.trim(); if (!q) return; f.q.value = ''; chatAsk(q); }
};

/* ───────── events ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.act === 'menu')) { S.menu = null; renderTop(); if (!el) return; }
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act !== 'close-go') e.preventDefault();
  if (el.dataset.act === 'close-go') { e.preventDefault(); }
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.drawer) { S.drawer = false; renderDrawer(); } else if ($('#modal-root .modal-wrap')) closeModal(); else if (S.menu) { S.menu = null; renderTop(); } else if (S.chatOpen) { S.chatOpen = false; renderChat(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex]:not(button):not(a)')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, e.submitter);
});
document.addEventListener('change', e => {
  const x = e.target;
  if (x.name === 'car' && x.id === 'sCar') { const o = $('[data-other-car]'); if (o) o.hidden = x.value !== 'other'; }
  if (x.name === 'when') { const s = $('[data-sched]'); if (s) s.hidden = x.value !== 'schedule'; }
  if (x.name === 'gkind') $$('[data-gk]').forEach(b => b.hidden = b.dataset.gk !== x.value);
  if (x.name === 'occasion' && $('#gOcc')) $('#gOcc').textContent = L(OCC[x.value].name);
});
document.addEventListener('input', e => {
  const x = e.target;
  if (x.dataset.live === 'adminQ') { S.adminQ = x.value; const tb = $('#adminTable'); if (tb) tb.innerHTML = ordersTable(adminFiltered()); }
  if (x.id === 'gName' && $('#gTo')) $('#gTo').textContent = x.value ? t('toX', { name: x.value }) : t('toYourFriend');
  if (x.id === 'ph') { const err = $('#phErr'); if (err) err.textContent = ''; }
  const pf = x.closest('[data-form="admin-price"]');
  if (pf) { const b = parseFloat(toLatin(pf.base.value)), d = parseFloat(toLatin(pf.disc.value)) || 0, o = DB.orders.find(y => y.id === pf.dataset.id);
    const tot = b >= 0 ? Math.round(b * (1 - d / 100) * (1 - (o.coupon || 0) / 100) * 1000) / 1000 : null; $('#apTotal').textContent = tot == null ? '—' : OMR(tot); }
});
document.addEventListener('pointermove', e => {
  const svc = e.target.closest && e.target.closest('.svc');
  if (svc) { const r = svc.getBoundingClientRect(); svc.style.setProperty('--px', (e.clientX - r.left) + 'px'); svc.style.setProperty('--py', (e.clientY - r.top) + 'px'); }
  const hero = e.target.closest && e.target.closest('.hero');
  if (hero && !REDUCED) {
    const r = hero.getBoundingClientRect(); hero.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%'); hero.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    const d = $('#dash') || $('.visual .emblem'); if (d && innerWidth > 920) { const dx = (e.clientX / innerWidth - .5), dy = (e.clientY / innerHeight - .5); d.style.transform = `perspective(1000px) rotateY(${dx * 6}deg) rotateX(${-dy * 6}deg)`; }
  }
}, { passive: true });
addEventListener('scroll', syncTopbar, { passive: true });
addEventListener('hashchange', route);
addEventListener('resize', positionKnob, { passive: true });
addEventListener('storage', e => { if (e.key === KEY) { loadDB(); if (!$('#modal-root .modal-wrap')) refresh(); else renderTop(); } });
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; renderFooter(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) renderTop(); }); } catch (e) {}

/* ───────── loading screen: once per visit, skipped by any tap, scroll or key ───────── */
function initIntro() {
  const el = $('#intro'); if (!el) return;
  const skip = el.querySelector('.intro-skip'); if (skip) skip.textContent = t('tapSkip');
  let seen = false; try { seen = sessionStorage.getItem('maseer.intro') === '1'; } catch (e) {}
  if (REDUCED || seen) { el.remove(); return; }
  try { sessionStorage.setItem('maseer.intro', '1'); } catch (e) {}
  const root = document.documentElement; root.classList.add('intro-on');
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    el.classList.add('open'); root.classList.remove('intro-on');
    setTimeout(() => el.remove(), 1100);
    removeEventListener('wheel', finish); removeEventListener('touchstart', finish); document.removeEventListener('keydown', finish); el.removeEventListener('click', finish);
  };
  el.addEventListener('click', finish); addEventListener('wheel', finish, { passive: true }); addEventListener('touchstart', finish, { passive: true }); document.addEventListener('keydown', finish);
  setTimeout(finish, 1750);
}

/* ───────── boot ───────── */
initIntro();
if (!loadDB()) { seedDemo(); saveDB(); }
if (S.phone && !DB.users[S.phone]) { S.phone = ''; prefs.set('session', ''); }
route();
checkAlerts();
setInterval(checkAlerts, 60000);

})();
</script>

</body></html>
